name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: check files
        run: |
          ls -la

      - name: build docker images
        run: |
          docker build -t devops-dash:v1 .
      
      - name: CI Version
        run: |
          echo "CI Success"
